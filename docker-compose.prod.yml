# Production stack for a single EC2 instance.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Deliberately ONE app replica: calling runs live in an in-process dict
# (Backend/services/calling_jobs.py), so a second replica would not see a
# campaign started by the first. Scaling requires moving that state out.
#
# Caddy terminates TLS and gets certificates from Let's Encrypt on its own,
# provided DNS for ${DOMAIN} already points at this instance and ports
# 80/443 are open.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hunar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-hunar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published ports: the database is reachable only from other
    # containers on this network, never from the internet.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hunar} -d ${POSTGRES_DB:-hunar}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs migrations to completion, then exits. The app waits on this so it
  # can never serve traffic against a schema that hasn't been upgraded.
  migrate:
    build:
      context: ./Backend
    env_file: ./Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hunar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hunar}
    command: ['alembic', 'upgrade', 'head']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./Backend
    restart: unless-stopped
    env_file: ./Backend/.env
    environment:
      # Overrides whatever .env says: inside the network the database is
      # `postgres`, not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hunar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hunar}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not published either — Caddy is the only way in.
    expose:
      - '8000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set, e.g. api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
